plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pcxx.tiaotiao'
    compileSdk 36

    defaultConfig {
        applicationId "com.pcxx.tiaotiao"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 本项目刻意不依赖 AndroidX / Material，纯平台 API，
    // 好处是可以用 SDK 自带工具直接出包，不依赖任何在线依赖。
}
